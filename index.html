<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A modern and responsive To-Do List application">
    <title>✨ My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div>
                <h1>✨ My To-Do List</h1>
                <p>Organize your day, one task at a time.</p>
            </div>

            <button
                id="themeToggle"
                class="theme-btn"
                type="button"
                aria-label="Switch to dark mode"
                title="Toggle theme"
            >
                🌙
            </button>
        </header>


        <!-- Add Task Section -->
        <section class="task-input-section" aria-label="Add a new task">

            <form id="taskForm" class="task-form">

                <label for="taskInput" class="sr-only">
                    Enter a task
                </label>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                    maxlength="200"
                >

                <button type="submit" class="add-btn">
                    <span>＋</span> Add Task
                </button>

            </form>

            <p id="validationMessage" class="validation-message" role="alert"></p>

        </section>


        <!-- Search -->
        <section class="search-section">

            <label for="searchInput" class="sr-only">
                Search tasks
            </label>

            <div class="search-box">
                <span aria-hidden="true">🔍</span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search tasks..."
                    autocomplete="off"
                >
            </div>

        </section>


        <!-- Statistics -->
        <section class="stats-section" aria-label="Task statistics">

            <div class="stat-card">
                <span id="totalTasks">0</span>
                <small>Total</small>
            </div>

            <div class="stat-card">
                <span id="activeTasks">0</span>
                <small>Active</small>
            </div>

            <div class="stat-card">
                <span id="completedTasks">0</span>
                <small>Completed</small>
            </div>

        </section>


        <!-- Filters -->
        <section class="task-controls">

            <div class="filter-buttons" role="group" aria-label="Task filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="active"
                >
                    Active
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>

            <button
                id="clearCompleted"
                class="clear-btn"
                type="button"
            >
                Clear Completed
            </button>

        </section>


        <!-- Task List -->
        <section class="tasks-section" aria-label="Task list">

            <ul id="taskList" class="task-list"></ul>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">

                <div class="empty-icon">📝</div>

                <h2 id="emptyTitle">No tasks yet</h2>

                <p id="emptyText">
                    Add your first task and start organizing your day.
                </p>

            </div>

        </section>


        <!-- Footer -->
        <footer class="app-footer">

            <p>
                <span id="taskCount">0 tasks remaining</span>
            </p>

        </footer>

    </main>


    <!-- Edit Modal -->
    <div
        id="editModal"
        class="modal hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="editModalTitle"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="editModalTitle">Edit Task</h2>

                <button
                    id="closeModal"
                    class="close-btn"
                    type="button"
                    aria-label="Close edit window"
                >
                    ×
                </button>

            </div>

            <label for="editInput">Task title</label>

            <input
                type="text"
                id="editInput"
                maxlength="200"
                autocomplete="off"
            >

            <div class="modal-actions">

                <button
                    id="cancelEdit"
                    class="cancel-btn"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="saveEdit"
                    class="save-btn"
                    type="button"
                >
                    Save Changes
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
